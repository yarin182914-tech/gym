<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ג׳יני</title>
<meta name="theme-color" content="#1b1a18">
<!-- Blocking on purpose: sets the colour theme before first paint. -->
<script src="js/theme-boot.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ג׳יני">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Linked separately rather than @import-ed: @import serialises the requests. -->
<link rel="stylesheet" href="css/01-tokens.css">
<link rel="stylesheet" href="css/02-base.css">
<link rel="stylesheet" href="css/03-components.css">
<link rel="stylesheet" href="css/04-utilities.css">
</head>
<body>

<a href="#app" class="skip-link">דילוג לתוכן</a>

<div id="auth-screen" class="auth-screen hidden">
  <h1>ג׳יני</h1>
  <p class="text-muted">כי מישהו צריך לנהל לך את החיים.</p>
  <button id="google-signin-btn" class="btn btn-primary">התחברות עם Google</button>
</div>

<!-- Route content is swapped in here. aria-live=polite so a screen reader
     announces the new screen after navigation, since there is no page load. -->
<main id="app" class="hidden" tabindex="-1" aria-live="polite" aria-busy="false"></main>

<!-- Icons here are the same Lucide path data as js/ui/icon.js — duplicated
     rather than shared, since this markup is static HTML and the JS helper
     only exists inside the module graph. data-icon names the icon each one
     copies; tools/test-nav-icons.mjs fails if they drift apart.
     data-routes: the screens that light up this tab (history and the workout charts live inside
     אימון, the progress screen opens from היום's level bar). -->
<nav id="bottom-nav" class="bottom-nav hidden" aria-label="ניווט ראשי">
  <a href="#/today" data-routes="today dashboard" data-icon="sun">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    <span>היום</span>
  </a>
  <a href="#/tasks" data-routes="tasks" data-icon="list-checks">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>
    <span>משימות</span>
  </a>
  <a href="#/session" data-routes="session history workout-progress" data-icon="dumbbell">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></svg>
    <span>אימון</span>
  </a>
  <a href="#/nutrition" data-routes="nutrition" data-icon="utensils">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
    <span>תזונה</span>
  </a>
  <a href="#/sleep" data-routes="sleep" data-icon="moon">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    <span>שינה</span>
  </a>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
